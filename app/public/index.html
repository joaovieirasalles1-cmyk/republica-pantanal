<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pantanal">
  <title>República Pantanal</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/brand/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="top" id="top" hidden>
      <button class="house-btn" data-go="/casa" aria-label="Abrir a casa">
        <span class="avatar sm" id="house-avatar"></span>
        <span class="house-title"><small>República</small><span id="house-name"></span></span>
      </button>
      <button class="bell" data-go="/notificacoes" aria-label="Notificações">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge" id="bell-count" hidden>0</span>
      </button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabs" id="tabs" hidden></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
